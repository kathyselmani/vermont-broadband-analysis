[project]
name = "vermont-broadband-analysis"
version = "0.1.0"
description = "Residential broadband availability, competition and digital-divide analysis for Vermont using FCC BDC and U.S. Census ACS data"
readme = "README.md"
authors = [
    { name = "kathyselmani", email = "kathylangarano@outlook.es" }
]
requires-python = ">=3.13"
dependencies = [
    "h3>=4.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyarrow>=25.0.1",
    "pyshp>=2.3.1",
    "requests>=2.34.2",
    "shapely>=2.1.0",
]

[project.scripts]
vermont-broadband-analysis = "vermont_broadband_analysis:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
